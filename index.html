<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiHealth — MVP demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E6B6B;--teal-d:#0A5252;--teal-l:#DDEEEC;--teal-xl:#F0F7F6;--coral:#B5482F;--coral-l:#F7E4DE;--amber:#96630F;--amber-l:#FBF0DB;--green:#2F7D4F;--green-l:#E2F2E8;--sand:#F3EFE9;--ink:#1F2226;--mute:#5F646B;--line:#DDD7CD;--bg:#FAF8F5;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;min-height:44px}
button:hover{border-color:#bdb4a6}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
button.pri:hover{background:var(--teal-d)}
button.warn{border-color:var(--coral);color:var(--coral)}
button.link{border:none;background:none;color:var(--teal);padding:4px 6px;min-height:0;text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;border:1px solid #bdb4a6;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);min-height:44px}
textarea{width:100%;min-height:70px}
h1,h2,h3{margin:0;line-height:1.25} h2{font-size:23px} h3{font-size:18px}
.muted{color:var(--mute)} .small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.c-teal{background:var(--teal-l);color:var(--teal)}.c-coral{background:var(--coral-l);color:var(--coral)}.c-amber{background:var(--amber-l);color:var(--amber)}.c-green{background:var(--green-l);color:var(--green)}.c-grey{background:#ECE9E4;color:#4d5157}
.label{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--teal)}
.logo .dot{width:28px;height:28px;border-radius:8px;background:var(--teal);display:grid;place-items:center;color:#fff}
.sim{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-l);border-radius:6px;padding:3px 8px}
.date{font-weight:600;background:var(--sand);border-radius:8px;padding:8px 12px}
.rolebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 18px;max-width:1240px;margin:0 auto;border-top:1px solid var(--line)}
.rolebtn{padding:6px 12px;min-height:40px;border-radius:999px;font-size:14px}
.rolebtn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;margin-top:14px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;flex-wrap:wrap;gap:6px}}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;margin-bottom:4px;position:relative}
.side button.on{background:var(--teal-l);color:var(--teal);font-weight:700}
.side button i{font-style:normal;margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px}
.bcard{display:flex;gap:16px;align-items:center;background:var(--teal);color:#fff;border-radius:var(--r);padding:14px 18px;flex-wrap:wrap;margin-top:14px}
.bcard.done{background:var(--green)}.bcard.free{background:#565c63}
.bcard .who{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 12px;text-align:center;min-width:120px}
.bcard .who b{display:block;font-size:19px}.bcard .who span{font-size:12.5px}
.bcard .txt{flex:1;min-width:260px}
.bcard .t0{font-size:13.5px;background:rgba(255,255,255,.15);border-radius:8px;padding:5px 10px;margin-bottom:7px}
.bcard .t1{font-size:12.5px;font-weight:600;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.bcard .t2{font-size:19px;font-weight:700;margin:1px 0}.bcard .t3{font-size:15.5px}
.bcard button.go{background:#fff;color:var(--teal);border:none;font-weight:700}
.pulse{outline:4px solid var(--coral)!important;outline-offset:3px;animation:pl 1.4s infinite;position:relative;z-index:2}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(181,72,47,.55)}70%{box-shadow:0 0 0 12px rgba(181,72,47,0)}100%{box-shadow:0 0 0 0 rgba(181,72,47,0)}}
.vh{margin-bottom:14px}.vh p{margin:4px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:none}.item.click{cursor:pointer}.item.click:hover{background:#FBFAF8}.item.sel{background:var(--teal-xl)}
.grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:15px}
.kv>div:nth-child(odd){color:var(--mute)}
@media (max-width:600px){.kv{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.form{grid-template-columns:1fr}}
.form label,.fl{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.form input,.form select{width:100%}
.req{color:var(--coral)}
.box{border-radius:12px;padding:12px 14px;margin-top:12px}
.b-coral{background:var(--coral-l);border:1px solid var(--coral)}.b-amber{background:var(--amber-l);border:1px solid #d8b56a}.b-teal{background:var(--teal-xl);border:1px solid var(--teal-l)}.b-green{background:var(--green-l);border:1px solid #9ccdb0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--teal);background:var(--teal-xl)}
.opt input{min-height:0;margin-top:4px;width:18px;height:18px}
.tl{margin:6px 0 0 6px;padding-left:16px;border-left:2px solid var(--line)}
.tl .ev{position:relative;padding:0 0 11px;font-size:15px}
.tl .ev:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.tl .ev.coral:before{background:var(--coral)}.tl .ev.amber:before{background:var(--amber)}.tl .ev.green:before{background:var(--green)}
.tl small{color:var(--mute);display:block;font-size:12.5px}
.range{position:relative;height:10px;border-radius:5px;background:var(--coral-l);margin:28px 0 22px}
.range .ok{position:absolute;top:0;bottom:0;background:#BFE3CB;border-radius:5px}
.range .mk{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.range .mk b{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap}
.range .lg{position:absolute;top:13px;font-size:11.5px;color:var(--green);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px}
.fchip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chat{background:#ECE5DD;border-radius:12px;padding:12px;max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bub{background:#fff;border-radius:10px;padding:8px 11px;max-width:86%;font-size:15px;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bub.in{align-self:flex-end;background:#DCF8C6}
.bub .alt{display:block;font-size:12.5px;color:var(--mute);border-top:1px dashed #ccc;margin-top:5px;padding-top:4px;direction:ltr;text-align:left;font-family:Inter,sans-serif}
.bub .st{display:block;font-size:11.5px;color:#777;margin-top:3px;direction:ltr;text-align:right;font-family:Inter,sans-serif}
.bub .st.fail{color:var(--coral);font-weight:700}
.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",Inter,serif}
.daysep{align-self:center;background:#E1F3FB;color:#46616e;border-radius:8px;font-size:12px;padding:2px 9px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#FBFAF8}
.empty{padding:26px;text-align:center;color:var(--mute)}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.slot{display:block;width:100%;text-align:left;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F2226;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.hero{max-width:980px;margin:0 auto;padding:44px 22px 30px}
.hero h1{font-size:40px;line-height:1.15;color:var(--ink);max-width:760px;margin-top:22px}
.lead{font-size:19px;color:#3b4046;max-width:700px;margin:14px 0 0}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.how{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
@media (max-width:520px){.how{grid-template-columns:1fr}}
.how .card{padding:18px}.how .n{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.how b{display:block;font-size:17px;margin-bottom:4px}
.team{display:flex;gap:10px;flex-wrap:wrap}.team>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:170px}
.team span{font-size:24px;display:block}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.strip .sg{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13.5px;color:var(--mute)}
.strip .sg i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#ECE9E4;display:grid;place-items:center;font-size:12px;font-weight:700}
.strip .sg.done{color:var(--green)}.strip .sg.done i{background:var(--green-l)}
.strip .sg.now{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}.strip .sg.now i{background:#fff;color:var(--teal)}
.strip .who2{font-weight:400;opacity:.85}
.handoff{max-width:640px;margin:26px auto;padding:34px;text-align:center}
.handoff .av{width:84px;height:84px;border-radius:50%;background:var(--teal-l);display:grid;place-items:center;font-size:40px;margin:0 auto 14px}
.handoff h2{font-size:27px}.handoff .lead{margin:12px auto 22px;font-size:18px}
.handoff .prev{background:var(--green-l);color:var(--green);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-bottom:18px;display:inline-block}
.rolebtn.dim{opacity:.45}
footer{color:var(--mute);font-size:12.5px;padding:14px 18px 30px}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* DigiHealth MVP: one staff-facing app, one shared record. All data is fictional.
   WhatsApp is SIMULATED: no real messages are sent. Reference ranges are simplified
   demonstration values, not validated clinical decision rules. */
const START=new Date(2026,10,16), KEY="digihealth-v7", FACILITY="Al Noor Family Clinic";
const CFG={remind:[3,5],window:7,unassigned:1};
const STAFF={
 nurse:{name:"Huda",title:"Screening nurse",icon:"📝",nav:["dash","patients","screening"]},
 lab:{name:"Ravi",title:"Lab technician",icon:"🧪",nav:["dash","lab","patients"]},
 omar:{name:"Dr. Omar",ar:"د. عمر",title:"Doctor · diabetes & cholesterol",icon:"🩺",nav:["dash","review","patients"]},
 layla:{name:"Dr. Layla",ar:"د. ليلى",title:"Doctor · kidney",icon:"🩺",nav:["dash","review","patients"]},
 coord:{name:"Mariam",title:"Care coordinator",icon:"📋",nav:["dash","cases","whatsapp","appts","patients"]},
 mgr:{name:"Salma",title:"Clinic manager",icon:"📊",nav:["dash","reports","cases","patients"]}};
const NAV={dash:["🏠","Dashboard"],patients:["👤","Patients"],screening:["📝","Screening"],lab:["🧪","Lab"],review:["🩺","Doctor review"],cases:["📂","Follow-up"],whatsapp:["💬","WhatsApp"],appts:["📅","Appointments"],reports:["📊","Reports"]};
const TESTS={
 hba1c:{name:"HbA1c (blood sugar)",unit:"%",ref:"below 5.7%",lo:4,hi:12,okFrom:4,okTo:5.7,inRef:v=>v<5.7},
 ldl:{name:"LDL cholesterol",unit:"mmol/L",ref:"below 3.0 mmol/L",lo:1,hi:7,okFrom:1,okTo:3,inRef:v=>v<3},
 egfr:{name:"eGFR (kidney function)",unit:"mL/min",ref:"above 60 mL/min",lo:0,hi:120,okFrom:60,okTo:120,inRef:v=>v>60}};
const ROUTE={hba1c:"omar",ldl:"omar",egfr:"layla"};
const DECISIONS={nfa:"No follow-up needed",routine:"Routine check later",appt:"Needs a visit",invest:"Needs more tests",refer:"Refer to a specialist",urgent:"Needs an urgent visit"};
const OUTCOMES={done:"Patient was seen and has a plan",nfa:"Doctor reviewed: nothing more needed",referred:"Referral accepted by the other clinic",declined:"Patient said no (doctor approved)",transferred:"Moved to another clinic, with a handover note"};
const PLANS={med:"Start or adjust treatment",recheck:"Recheck the test in 3 months",refer:"Refer to a specialist"};
const FATIMA={name:"Fatima Al Mansoori",dob:"1974-03-12",sex:"Female",phone:"+971 50 123 1182",lang:"ar",channel:"WhatsApp",natId:"784-1974-1042335-1",consent:true};
const AHMED_NAT="784-1979-1189027-3";

let S=null,MODAL=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return null};
const dd=d=>{const x=new Date(START);x.setDate(x.getDate()+d);return x};
const fmt=d=>dd(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtAr=d=>dd(d).toLocaleDateString("ar-AE",{weekday:"long",day:"numeric",month:"long"});
const esc=t=>String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const P=id=>S.patients[id],E=id=>S.episodes.find(e=>e.id===id),T=id=>S.tests.find(t=>t.id===id),C=id=>S.cases.find(c=>c.id===id);
const byNat=n=>Object.values(S.patients).find(p=>p.natId===n);
const who=()=>STAFF[S.role].name, age=p=>2026-parseInt(p.dob.slice(0,4),10);
const U=(k,v)=>{S.ui[k]=v;save()};
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),3000)}
function ev(ref,text,tone,actor){S.events.push(Object.assign({day:S.day,actor:actor||who(),text,tone:tone||"teal"},ref))}

/* ================= core actions (the single shared workflow) ================= */
function regPatient(d){const p={id:"P-"+(++S.n.p),name:d.name.trim(),first:d.name.trim().split(/\s+/)[0],dob:d.dob,sex:d.sex,phone:d.phone.trim(),lang:d.lang,channel:d.channel,natId:d.natId.trim(),consent:!!d.consent,status:"Active",regDay:S.day,phoneHist:[],badPhone:!!d.badPhone};
 S.patients[p.id]=p;ev({pid:p.id},`Patient registered with ID ${p.id}`);return p}
function dupes(d,skip){const n=(d.name||"").trim().toLowerCase(),ph=(d.phone||"").replace(/\D/g,""),nat=(d.natId||"").trim();const out=[];
 Object.values(S.patients).forEach(p=>{if(p.id===skip)return;if(nat&&p.natId===nat)out.push({p,why:"same ID number",strong:true});
  else if(n&&d.dob&&p.name.toLowerCase()===n&&p.dob===d.dob)out.push({p,why:"same name and date of birth"});
  else if(ph.length>=9&&p.phone.replace(/\D/g,"")===ph)out.push({p,why:"same phone number"})});return out}
function newEpisode(pid,programme){const e={id:"S-"+(++S.n.s),pid,day:S.day,facility:FACILITY,programme:programme||"Comprehensive health screening",staff:who(),assess:null};
 S.episodes.push(e);ev({pid,eid:e.id},`Screening visit ${e.id} started (${e.programme})`);return e}
function orderTest(eid,test){const e=E(eid),t={id:"T-"+(++S.n.t),eid,pid:e.pid,test,status:"Ordered",orderedDay:S.day,collectedDay:null,value:null,releasedDay:null,note:"",hist:[],doctor:ROUTE[test],review:null};
 S.tests.push(t);ev({pid:e.pid,eid,tid:t.id},`${TESTS[test].name} ordered (${t.id})`);return t}
function saveAssess(eid,d){const e=E(eid);e.assess={bp:d.bp,notes:d.notes,by:who(),day:S.day};ev({pid:e.pid,eid},"Screening assessment recorded");d.tests.forEach(t=>orderTest(eid,t))}
const tref=t=>({pid:t.pid,eid:t.eid,tid:t.id});
function collect(tid){const t=T(tid),re=t.status==="New sample needed";t.status="Sample collected";t.collectedDay=S.day;t.hist.push({day:S.day,what:re?"New sample collected":"Sample collected",by:who()});ev(tref(t),`${re?"New sample":"Sample"} collected for ${TESTS[t.test].name}`)}
function rejectSample(tid,reason){const t=T(tid);t.status="New sample needed";t.hist.push({day:S.day,what:"Sample rejected: "+reason,by:who()});ev(tref(t),`Sample rejected (${reason}). New sample needed.`,"coral")}
function release(tid,value,note){const t=T(tid);t.hist.push({day:S.day,what:`Result ${value} ${TESTS[t.test].unit} released`,by:who()});t.value=value;t.note=note||"";t.status="Sent to doctor";t.releasedDay=S.day;t.review={status:"Waiting for doctor"};
 ev(tref(t),`${TESTS[t.test].name} result recorded and released to ${STAFF[t.doctor].name} for review`)}
function reviewResult(tid,d){const t=T(tid);t.review={status:"Reviewed",decision:d.decision,urgency:d.urgency,assessment:d.assessment,by:who(),day:S.day};
 ev(tref(t),`Result reviewed. Decision: ${DECISIONS[d.decision]}`,d.decision==="nfa"?"green":"teal");if(d.decision==="nfa")return null;
 const c={id:"F-"+(++S.n.f),pid:t.pid,eid:t.eid,tid,reason:`${DECISIONS[d.decision]} after ${TESTS[t.test].name} result`,decision:d.decision,urgency:d.urgency,clinician:t.doctor,createdDay:S.day,owner:"Mariam",
  appt:null,apptHist:[],calls:[],reply:null,replyDay:null,slots:null,slotsDay:null,firstMsgDay:null,reminders:[],outcome:null,closed:null,decline:null,referral:d.decision==="refer"?{ack:false}:null,handovers:[]};
 S.cases.push(c);ev({pid:c.pid,eid:c.eid,cid:c.id},`Follow-up case ${c.id} opened and given to Mariam`,"amber","DigiHealth");return c}
const cref=c=>({pid:c.pid,eid:c.eid,cid:c.id});
function acceptCase(cid){const c=C(cid),prev=c.owner;c.owner=who();if(prev)c.handovers.push({day:S.day,from:prev,to:c.owner});ev(cref(c),prev?`Case handed over from ${prev} to ${c.owner}`:`${c.owner} accepted ownership of the case`)}
function releaseCase(cid){const c=C(cid);c.handovers.push({day:S.day,from:c.owner,to:null});ev(cref(c),`${c.owner} released the case. It is back in the unassigned queue.`,"amber");c.owner=null}
function tplText(k,c,ar,x){const p=P(c.pid),d=STAFF[c.clinician],dn=ar?d.ar:d.name,f=ar?fmtAr:fmt,cl=ar?"عيادة النور للعائلة":FACILITY;x=x||{};
 switch(k){

 if(c.closed)return o("Closed","green","None","",null,null);

 if(c.outcome)return o("Ready to close","green","Close the case","The patient was seen and the doctor wrote the notes.",c.outcome.day+1,"close");
 if(c.referral)return c.referral.ack?o("Ready to close","green","Close the case","The receiving clinic accepted the referral.",d,"close"):o("Waiting for referral","amber","Confirm the receiving clinic accepted the referral","A referral nobody acknowledged can be lost.",c.createdDay+3,"ack");
 const a=c.appt;
 if(a&&!(["Missed","Cancelled"].includes(a.status)&&(c.reply||c.slots))){if(a.status==="Attended")return o("Waiting for doctor's notes","amber",`${doc} documents the outcome`,"The patient came. The doctor still needs to write the visit notes.",a.day+1,null,doc);

 ${!c.closed?`<div class="box b-${s.tone==="teal"?"teal":s.tone}"><div class="kv"><div>Status</div><div><b>${s.status}</b>${s.why?". "+esc(s.why):""}</div><div>What to do next</div><div><b>${esc(s.next)}</b></div><div>Follow-up owner</div><div>${esc(s.owner)}</div><div>By when</div><div>${dueTxt(s.due)}</div></div>
  ${P1?`<div style="margin-top:12px"><button class="pri" id="primary" ${can?"":"disabled"} onclick="${P1[1]}">${P1[0]}</button>${can?"":` <span class="small muted">Only the coordinator can do this.</span>`}</div>`:""}</div>`
 :`<div class="box b-green"><b>Closed ${fmt(c.closed.day)} by ${esc(c.closed.by)}</b><br>${OUTCOMES[c.closed.outcome]}${c.closed.notes?"<br><span class='small'>"+esc(c.closed.notes)+"</span>":""}</div>`}
 <div class="kv" style="margin-top:14px"><div>Why</div><div>${esc(c.reason)}</div><div>Clinical decision</div><div>${STAFF[c.clinician].name}: ${DECISIONS[c.decision]} · how soon: <b>${c.urgency}</b></div><div>Created</div><div>${fmt(c.createdDay)}</div>
  <div>Contact</div><div>${esc(p.phone)} ${p.badPhone?`<span class="chip c-coral">Not working</span>`:""} · ${S.msgs.filter(m=>m.cid===c.id).length} WhatsApp messages · ${c.calls.length} phone calls</div>
  <div>Appointment</div><div>${c.appt?`${fmt(c.appt.day)} · <b>${c.appt.status}</b>`:"Not scheduled"}${c.apptHist.map(a=>`<div class="small muted">Earlier: ${fmt(a.day)} · ${a.status}</div>`).join("")}</div>
  <div>Doctor's notes</div><div>${c.outcome?`${esc(c.outcome.summary)} Plan: ${c.outcome.plan.map(k=>PLANS[k]).join("; ")||"none"} (${esc(c.outcome.by)}, ${fmt(c.outcome.day)})`:"Not documented yet"}</div></div>
 ${!c.closed&&can?`<div class="row" style="margin-top:14px"><button onclick="go('whatsapp',{chat:'${p.id}'})">💬 Open WhatsApp</button>${c.owner?`<button onclick="openCall('${c.id}')">📞 Log a phone call</button>`:""}${s.act!=="close"?`<button onclick="openClose('${c.id}')">Close case…</button>`:""}</div>`:""}
 ${!c.closed?`<div class="label">What this case needs before it can close</div><div class="box b-teal small" style="margin-top:0">${c.appt&&c.appt.status==="Attended"?"✅":"⬜"} The patient was seen &nbsp; ${c.outcome?"✅":"⬜"} The doctor wrote the visit notes<br><span class="muted">Or a doctor-approved reason: the patient said no, another clinic accepted the referral, or the patient moved with a handover note. A message, a reply, a booking or a call attempt never closes a case.</span></div>`:""}
 <div class="label">Case history</div>${timeline(S.events.filter(e=>e.cid===c.id))}</div>`}
function doAccept(cid){acceptCase(cid);if(S.ui.cf==="un")S.ui.cf="mine";S.sel.case=cid;save();render();toast("You now own this case.")}
function openCall(cid){const c=C(cid),p=P(c.pid);openModal(`<h3>📞 Phone call to ${esc(p.name)}</h3><p class="muted">${esc(p.phone)} · speaks ${p.lang==="ar"?"Arabic":"English"} · call attempt ${c.calls.length+1}. Record what happened.</p>
 <div class="label">Patient answered: book the visit with ${STAFF[c.clinician].name}</div>${[1,2,4].map((o,i)=>`<button class="slot" id="callBook${i}" onclick="doCall('${cid}','Reached',${S.day+o})">${fmt(S.day+o)}</button>`).join("")}
 <div class="label">Could not arrange a visit</div><button class="slot" id="callNo" onclick="doCall('${cid}','No answer')">No answer</button><button class="slot" onclick="doCall('${cid}','Wrong number')">Wrong number</button><button class="slot" onclick="doCall('${cid}','Patient declines')">Patient answered but declines follow-up</button>
 <div style="text-align:right"><button class="link" onclick="closeModal();render()">Cancel</button></div>`,"call")}
function doCall(cid,outcome,day){logCall(cid,outcome);if(outcome==="Reached")bookAppt(cid,day,"Phone");closeModal();save();render();
 toast({Reached:"Visit booked for "+fmt(day||0)+".","No answer":"Call logged. The case stays open and is due again tomorrow.","Wrong number":"Number marked as not working. Next action: update contact details.","Patient declines":"Recorded. The doctor must authorise before this case can close."}[outcome])}
function openClose(cid,keep){const c=C(cid),ok=closable(c),u=S.ui,first=Object.keys(OUTCOMES).find(k=>ok[k]===null);if(!keep){u.cl_out=first||"done";u.cl_notes=""}
 const sel=u.cl_out,need=sel==="transferred"?null:ok[sel];
 const chk=(b,t)=>`<div>${b?"✅":"⬜"} ${t}</div>`;
 openModal(`<h3>Close case ${c.id}</h3><p class="muted">A case can close only when we know what happened to the patient. A message, a reply or a booking is not enough.</p>
 <div class="box b-teal">${chk(c.appt&&c.appt.status==="Attended","Appointment attended")}${chk(!!c.outcome,"Doctor wrote the visit notes")}</div>
 <div class="label">Outcome</div>${Object.entries(OUTCOMES).map(([k,l])=>`<label class="opt ${sel===k?"on":""}" onclick="U('cl_out','${k}');openClose('${cid}',1)"><input type="radio" ${sel===k?"checked":""}><div><b>${l}</b>${ok[k]?`<div class="small" style="color:var(--coral)">Not available: ${ok[k]}</div>`:""}</div></label>`).join("")}
 <label class="fl">Notes</label><textarea id="clNotes" placeholder="${sel==="transferred"?"Required: which facility accepted the patient, who confirmed it, and when":"Optional"}" oninput="U('cl_notes',this.value)">${esc(u.cl_notes||"")}</textarea>
 ${need?`<div class="box b-coral"><b>Not yet:</b> ${need}. The case stays open.</div>`:""}
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="closeModal();render()">Cancel</button><button class="pri" id="confirmClose" ${need?"disabled":""} onclick="doClose('${cid}')">Close case</button></div>`,"close")}
function doClose(cid){const u=S.ui;if(u.cl_out==="transferred"&&(document.getElementById("clNotes").value||"").trim().length<15)return toast("Write the handover note first: which facility accepted the patient, who confirmed it, and when.");closeCase(cid,u.cl_out,(document.getElementById("clNotes").value||"").trim()||"Outcome verified by coordinator.");delete u.cl_out;delete u.cl_notes;closeModal();save();render();toast("Case closed with a documented outcome.")}

/* ================= WhatsApp simulator ================= */
function chatHtml(pid){const p=P(pid),ar=p.lang==="ar",M=S.msgs.filter(m=>m.pid===pid);let last=null;
 return`<div class="chat">${M.map(m=>{let h="";if(m.day!==last){h=`<div class="daysep">${fmt(m.day)}</div>`;last=m.day}
  return h+`<div class="bub ${m.dir==="in"?"in":""} ${ar?"rtl":""}">${esc(m.text)}${m.alt?`<span class="alt">EN: ${esc(m.alt)}</span>`:""}<span class="st ${m.status==="Failed"?"fail":""}">${m.dir==="out"?(m.status==="Failed"?"✗ Failed":m.status==="Responded"?"✓✓ Delivered · patient responded":"✓✓ "+m.status):"Patient · simulated"}</span></div>`}).join("")||`<div class="daysep">No messages yet</div>`}</div>`}
function vWhatsApp(){const ids=[...new Set(S.cases.filter(c=>c.owner||S.msgs.some(m=>m.cid===c.id)).map(c=>c.pid))];let pid=S.sel.chat;if(!ids.includes(pid))pid=ids[0];
 if(!pid)return`<div class="vh"><h2>WhatsApp</h2></div><div class="card empty">No conversations yet. Accept a follow-up case first.</div>`;
 const p=P(pid),c=S.cases.filter(x=>x.pid===pid&&!x.closed&&x.owner).pop(),s=c&&cs(c),u=S.ui,can=S.role==="coord";
 const tpl=u.tpl&&TPL[u.tpl]?u.tpl:(c&&c.firstMsgDay==null?"invite":c&&c.appt&&c.appt.status==="Missed"?"missed":"remind"),ar=p.lang==="ar",delivered=c&&S.msgs.some(m=>m.cid===c.id&&m.dir==="out"&&m.status!=="Failed");
 return`<div class="vh"><h2>WhatsApp</h2><p class="muted">Patients need no app and no login. Messages never contain test results.</p></div>
 <div class="box b-amber" style="margin:0 0 14px"><b>Simulator.</b> No real WhatsApp messages are sent. A real deployment needs patient consent, approved templates and the WhatsApp Business Platform.</div>
 <div class="grid2"><div class="card">${ids.map(id=>{const x=P(id),xc=S.cases.filter(k=>k.pid===id).pop();return`<div class="item click ${id===pid?"sel":""}" onclick="S.sel.chat='${id}';render()"><div class="grow"><b>${esc(x.name)}</b><div class="small muted">${esc(x.phone)}</div></div><span class="chip c-${cs(xc).tone}">${cs(xc).status}</span></div>`}).join("")}</div>
 <div class="card pad"><div class="spread"><div><b>${esc(p.name)}</b> <span class="muted small">· ${esc(p.phone)} ${p.badPhone?`<span class="chip c-coral">Number not working</span>`:"· verified at registration"} · ${ar?"Arabic":"English"}</span></div>${c?`<span class="chip c-${s.tone}">${s.status}</span>`:""}</div>
 <div style="margin-top:10px">${chatHtml(pid)}</div>
 ${c?`${s.act==="offer"?`<div class="box b-teal"><b>The patient asked to book.</b><div style="margin-top:8px"><button class="pri" id="offerBtn" ${can?"":"disabled"} onclick="offerTimes('${c.id}');save();render();toast('Appointment times sent (simulated).')">Offer appointment times</button></div></div>`:""}
  ${s.act==="phone"||p.badPhone?`<div class="box b-coral"><b>${p.badPhone?"Messages are not reaching this number.":"The patient reported a new number."}</b> <button class="link" onclick="U('editPhone','${p.id}');U('newPhone','${c.reply==="phone"?"+971 50 555 0142":""}');go('patients',{patient:'${p.id}'})">Update the phone number</button> or <button class="link" onclick="openCall('${c.id}')">log a phone call</button>.</div>`:""}
  <div class="label">Staff: send a message template</div><div class="row"><select onchange="U('tpl',this.value);render()">${Object.entries(TPL).map(([k,l])=>`<option value="${k}" ${k===tpl?"selected":""}>${l}</option>`).join("")}</select><button class="pri" id="sendTpl" ${can?"":"disabled"} onclick="sendMsg('${c.id}','${tpl}');save();render();toast(P('${pid}').badPhone?'Message failed. A recovery task was created.':'Message sent (simulated).')">Send on WhatsApp (simulated)</button></div>
  <div class="box b-teal ${ar?"rtl":""}" style="white-space:pre-wrap"><span class="tiny muted" style="direction:ltr;display:block;text-align:left;font-family:Inter">Draft preview (${ar?"Arabic":"English"})</span>${esc(tplText(tpl,c,ar))}${ar?`<span class="tiny muted" style="direction:ltr;display:block;text-align:left;font-family:Inter;margin-top:6px">EN: ${esc(tplText(tpl,c,false))}</span>`:""}</div>
  <div class="label">Demo control: play the patient's reply</div>${!delivered?`<span class="muted small">Send a message that is delivered first.</span>`:c.slots?`<div class="row">${c.slots.map((d,i)=>`<button id="sim-slot${i}" onclick="patientReply('${c.id}','slot',${i});save();render();toast('Patient chose a time. Appointment confirmed.')">${"ABC"[i]} · ${fmt(d)}</button>`).join("")}</div>`
   :`<div class="row"><button id="sim-book" onclick="simReply('${c.id}','book')">1 · Book a visit</button><button onclick="simReply('${c.id}','human')">2 · Speak to coordinator</button><button onclick="simReply('${c.id}','phone')">“My number changed”</button><button onclick="simReply('${c.id}','decline')">“I don't want to come”</button></div>`}`
 :`<p class="muted small">No open case with an owner for this patient.</p>`}</div></div>`}
function simReply(cid,k){patientReply(cid,k);save();render();toast("Patient reply received (simulated). The case updated.")}

/* ================= Appointments ================= */
function vAppts(){const R=[];S.cases.forEach(c=>{c.apptHist.forEach(a=>R.push({c,a,old:true}));if(c.appt)R.push({c,a:c.appt})});R.sort((x,y)=>y.a.day-x.a.day);
 const chip=a=>({Attended:"c-green",Missed:"c-coral",Cancelled:"c-coral"})[a.status]||"c-teal",can=S.role==="coord";
 return`<div class="vh"><h2>Appointments</h2><p class="muted">Booked is not attended. Record what really happened on the day.</p></div>
 <div class="card" style="overflow:auto"><table><thead><tr><th>Date</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead><tbody>${R.map(({c,a,old})=>{const dueNow=!old&&!c.closed&&["Booked","Confirmed","Reminder sent"].includes(a.status);
  return`<tr><td><b>${fmt(a.day)}</b>${a.day===S.day&&dueNow?` <span class="chip c-amber">Today</span>`:a.day<S.day&&dueNow?` <span class="chip c-coral">Not recorded</span>`:""}</td><td>${esc(P(c.pid).name)}<div class="small muted">${c.id} · booked ${a.via==="WhatsApp"?"on WhatsApp":"by phone"}</div></td><td>${STAFF[c.clinician].name}</td><td><span class="chip ${chip(a)}">${a.status}</span></td>
  <td>${dueNow&&a.day<=S.day?`<div class="row"><button class="pri" id="att-${c.id}" ${can?"":"disabled"} onclick="doAppt('${c.id}','Attended')">Attended</button><button class="warn" ${can?"":"disabled"} onclick="doAppt('${c.id}','Missed')">Missed</button></div>`:dueNow?`<button ${can?"":"disabled"} onclick="doAppt('${c.id}','Cancelled')">Cancel</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No appointments yet.</td></tr>`}</tbody></table></div>`}
function doAppt(cid,st){markAppt(cid,st);save();render();toast({Attended:"Attendance recorded. The doctor now documents the outcome.",Missed:"Marked as missed. The case stays open with a new task to rebook.",Cancelled:"Cancelled. The case stays open with a task to rebook."}[st])}

/* ================= Reports ================= */
function vReports(){const Cs=S.cases,pc=(a,b)=>b?Math.round(a*100/b)+"%":"n/a",first=c=>{const d=[...S.msgs.filter(m=>m.cid===c.id&&m.dir==="out").map(m=>m.day),...c.calls.map(k=>k.day)];return d.length?Math.min(...d):null};
 const contacted=Cs.filter(c=>first(c)!=null),msgd=Cs.filter(c=>c.firstMsgDay!=null),resp=msgd.filter(c=>S.msgs.some(m=>m.cid===c.id&&m.dir==="in")),ap=[];Cs.forEach(c=>{c.apptHist.forEach(a=>ap.push(a));if(c.appt)ap.push(c.appt)});
 const past=ap.filter(a=>["Attended","Missed"].includes(a.status)),refs=Cs.filter(c=>c.referral),lost=Cs.filter(c=>!c.closed&&c.calls.filter(k=>k.outcome==="No answer").length>=3);
 const M=[["Registered patients",Object.keys(S.patients).length,"Unique patient records."],["Screening visits completed",`${S.episodes.filter(e=>epStatus(e)[0]==="Completed").length} of ${S.episodes.length}`,"Visits where every ordered test has been reviewed by a doctor ÷ all visits."],
 ["Tests awaiting a result",S.tests.filter(t=>t.status!=="Sent to doctor").length,"Lab tests ordered but not yet released (includes rejected samples)."],["Results awaiting clinical review",S.tests.filter(t=>t.review&&t.review.status==="Waiting for doctor").length,"Released results that no doctor has reviewed yet."],
 ["Out-of-range results with a doctor's review and a next step",(()=>{const o=S.tests.filter(t=>t.value!=null&&!TESTS[t.test].inRef(t.value)),k=o.filter(t=>t.review&&t.review.status==="Reviewed"&&(t.review.decision==="nfa"||S.cases.some(c=>c.tid===t.id&&c.owner)));return pc(k.length,o.length)+` (${k.length} of ${o.length})`})(),"Results outside the demo reference range that a doctor has reviewed and that either need no follow-up or have a follow-up case with an owner ÷ all results outside that range."],
 ["Cases with no owner",Cs.filter(c=>!c.closed&&!c.owner).length,"Each case is given to the coordinator when it is opened, so this should stay 0."],
 ["Follow-up cases created",Cs.length,"One case per doctor decision that needs follow-up."],["Overdue cases",Cs.filter(overdue).length,"Open cases whose next action is past its due date."],
 ["Follow-up completion rate",pc(Cs.filter(c=>c.closed&&c.closed.outcome==="done").length,Cs.length),"Cases closed as “patient was seen and has a plan” ÷ all follow-up cases created."],
 ["Time to first follow-up action",contacted.length?(contacted.reduce((s,c)=>s+first(c)-c.createdDay,0)/contacted.length).toFixed(1)+" days":"n/a",`Average days from case creation to the first message or call (${contacted.length} cases contacted).`],
 ["Patient response rate",pc(resp.length,msgd.length),"Cases where the patient replied on WhatsApp ÷ cases with a delivered message."],["Appointment attendance rate",pc(past.filter(a=>a.status==="Attended").length,past.length),"Appointments attended ÷ appointments with a recorded result (attended or missed)."],
 ["Referral completion rate",pc(refs.filter(c=>c.referral.ack).length,refs.length),"Referrals acknowledged by the receiving clinic ÷ referral cases."],["Lost-to-follow-up risk",pc(lost.length,Cs.length),"Open cases with 3 or more unanswered calls ÷ all cases. They stay open and visible."]];
 return`<div class="vh"><h2>Reports</h2><p class="muted">Every number is counted live from the demo records and says exactly what it measures.</p></div>
 <div class="box b-amber" style="margin:0 0 14px"><b>Synthetic demo data.</b> These numbers show how the measures work. They are not evidence that DigiHealth improves follow-up; that needs a real pilot.</div>
 <div class="card" style="overflow:auto"><table><thead><tr><th>Measure</th><th>Value</th><th>What it counts</th></tr></thead><tbody>${M.map(([a,b,c])=>`<tr><td><b>${a}</b></td><td style="font-size:18px;font-weight:700;color:var(--teal);white-space:nowrap">${b}</td><td class="small muted">${c}</td></tr>`).join("")}</tbody></table></div>
 <div class="label">Timeframes used in this demo (configurable, not clinical rules)</div><div class="card pad small">Automatic WhatsApp reminders on day ${CFG.remind.join(" and ")} without a reply · phone call due after ${CFG.window} days without a reply · failed call retried the next day · appointment reminder the day before · urgent cases: call the same day, no waiting for reminders. This is an example schedule; a real clinic would set it with its doctors for each level of urgency.</div>`}

document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg"){closeModal();render()}});
S=load();if(!S)seed();render();
</script>
